<script type="module">
import {
  signInWebsite,
  sendBotMessage,
  listenForBotMessages
} from "./firebase.js";

const status = document.getElementById("scanStatus");

async function connectDetectiveMemeBots() {
  try {
    const email = prompt("Enter your Firebase account email:");
    if (!email) {
      status.textContent = "Firebase connection cancelled.";
      return;
    }

    const password = prompt("Enter your Firebase account password:");
    if (!password) {
      status.textContent = "Firebase connection cancelled.";
      return;
    }

    status.textContent = "Connecting to Firebase...";

    await signInWebsite(email.trim(), password);

    listenForBotMessages((messages) => {
      console.log("Messages from both bots:", messages);
    });

    await sendBotMessage(
      "Website",
      JSON.stringify({
        type: "BOT_ONLINE",
        message: "Website bot connected to Firebase",
        timestamp: new Date().toISOString()
      })
    );

    status.textContent =
      "Website authenticated. Waiting for Pythonista bot reply.";

  } catch (error) {
    console.error("Firebase connection failed:", error);
    status.textContent = "Firebase error: " + error.message;
  }
}

connectDetectiveMemeBots();
</script>
